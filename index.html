<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>บ้านบรู Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // ตั้งธีมก่อน render กันหน้าจอกะพริบขาว: ค่าที่ผู้ใช้เลือกไว้ ไม่งั้นใช้โหมดมืด (ธีมหลักของแบรนด์: ดำ + ทอง)
      (function () {
        var t = null;
        try { t = localStorage.getItem("baanbrew-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Trirong:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
