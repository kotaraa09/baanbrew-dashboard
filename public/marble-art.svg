<path d="M380 230C560 170 640 122 780 118S1000 60 1240-30L1240 22C1040 100 930 150 800 160S600 202 470 242Z" fill="url(#gold)" filter="url(#glitter)"/>
<path d="M560 252C700 226 820 206 880 204S1100 150 1240 110L1240 128C1110 166 1000 212 900 222S720 246 620 262Z" fill="url(#gold)" filter="url(#glitter)"/>
